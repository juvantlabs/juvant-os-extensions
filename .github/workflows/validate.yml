name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install juvant-os in a scratch company
        env:
          GH_TOKEN: ${{ github.token }}  # setup checks the release on GitHub: the token avoids the shared anonymous quota
        run: |
          git clone -q --branch v2.1.2 https://github.com/juvantlabs/juvant-os.git "$RUNNER_TEMP/jos"
          for i in 1 2 3; do
            bash "$RUNNER_TEMP/jos/setup.sh" "$RUNNER_TEMP/co" --company Morvento && exit 0
            rm -rf "$RUNNER_TEMP/co"; sleep $((i * 10))
          done
          exit 1
      - run: python3 tools/validate.py "$RUNNER_TEMP/co"
